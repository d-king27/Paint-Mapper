<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paint Mapper</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">
            <span style="background:#991115"></span>
            <span style="background:#31639c"></span>
            <span style="background:#9c8a53"></span>
          </div>
          <div>
            <h1>Paint Mapper</h1>
            <p id="dataSummary">Loading paint ranges...</p>
          </div>
        </div>
        <a class="source-link" href="https://www.dakkadakka.com/wiki/en/paint_range_compatibility_chart" target="_blank" rel="noreferrer">
          Source
        </a>
      </header>

      <main class="mapper" aria-live="polite">
        <section class="search-panel" aria-label="Paint search">
          <div class="search-box">
            <label for="paintSearch">Search by paint, brand, note, or hex</label>
            <div class="search-row">
              <input id="paintSearch" type="search" autocomplete="off" placeholder="Try Mephiston Red, Nuln Oil, Vallejo, #991115..." />
              <button id="clearSearch" class="icon-button" type="button" title="Clear search" aria-label="Clear search">×</button>
            </div>
          </div>

          <div class="filter-grid">
            <label>
              Owned brand
              <select id="ownedBrand"></select>
            </label>
            <label>
              Result type
              <select id="resultMode">
                <option value="matches">Text matches</option>
                <option value="all">All paints</option>
                <option value="notes">With notes</option>
              </select>
            </label>
          </div>

          <div class="brand-strip" id="brandStrip" aria-label="Visible equivalent brands"></div>

          <div class="result-meta">
            <span id="resultCount">0 paints</span>
            <span id="activeHint">Type a paint name to begin</span>
          </div>

          <div class="results" id="results" role="list"></div>
        </section>

        <section class="detail-panel" id="detailPanel" aria-label="Paint equivalents">
          <div class="empty-state">
            <div class="empty-swatch" aria-hidden="true"></div>
            <h2>Pick a paint to map its equivalents</h2>
            <p>Search for something you own, then use the brand filters to compare ranges.</p>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
